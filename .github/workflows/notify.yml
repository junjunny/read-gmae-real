name: jhs-notify
  on:
    schedule:
      - cron: "*/10 * * * *"
    workflow_dispatch: {}
  permissions:
    contents: read
  jobs:
    notify:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: "20"
        - run: npm install firebase-admin@^12
        - run: node notify.js
          env:
            FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
