name: grim_pingpong
description: 커플/친구끼리 매일 랜덤 주제로 그림을 그리고 홈 위젯으로 공유하는 앱.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- 캔버스 PNG 렌더링은 Flutter 기본 dart:ui 사용 (별도 의존성 없음) ---

  # 로컬 사진첩 저장 (요구사항 3)
  saver_gallery: ^3.0.6
  permission_handler: ^11.3.0
  path_provider: ^2.1.4

  # Firebase (Phase 1)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3

  # 이미지 캐싱 (히스토리 갤러리, Phase 3)
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  http: ^1.2.2
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
